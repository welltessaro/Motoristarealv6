<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.json" />
    
    <title>MotoristaReal | Gestão Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
      // Shim para evitar erro de 'process is not defined' no navegador
      window.process = { env: { NODE_ENV: 'production' } };
      
      // Capturador de erro global para diagnosticar tela branca
      window.onerror = function(msg, url, line, col, error) {
        const root = document.getElementById('root');
        if (root && root.innerHTML === '') {
          root.innerHTML = `<div style="padding: 20px; font-family: sans-serif; text-align: center; color: #1e293b;">
            <div style="background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);">
              <h2 style="color: #ef4444; font-weight: 900; margin-bottom: 10px;">Erro de Inicialização</h2>
              <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">O navegador encontrou um erro ao carregar o app.</p>
              <div style="background: #f8fafc; padding: 10px; border-radius: 12px; font-family: monospace; font-size: 11px; text-align: left; overflow: auto; margin-bottom: 20px;">
                ${msg}
              </div>
              <button onclick="location.reload()" style="width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 14px; font-weight: bold; cursor: pointer;">Tentar Novamente</button>
            </div>
          </div>`;
        }
        return false;
      };

      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: {
              primary: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857' },
              secondary: { 500: '#3b82f6', 600: '#2563eb' }
            }
          }
        }
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "recharts": "https://esm.sh/recharts@2.13.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.46.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
    <style>
      #root:empty::before {
        content: "";
        display: block;
        width: 40px;
        height: 40px;
        margin: 45vh auto;
        border: 4px solid #f1f5f9;
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      body { margin: 0; padding: 0; background-color: #f8fafc; }
    </style>
</head>
  <body class="bg-slate-50 text-slate-900 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
